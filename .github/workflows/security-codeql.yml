# GitHub Code Security — CodeQL static analysis (Challenge 03, Secure SDLC).
#
# Scans the C# Orders API and the Python agent / MCP server with the CodeQL engine and
# uploads results to the repository's code-scanning alerts. Findings are eligible for
# Copilot Autofix (see docs/challenges/challenge-03-secure-sdlc/coach-notes.md).
#
# Modern CodeQL uses build-mode "none" by default for C# (and C/C++, Java, Rust): the
# database is built straight from source with no .NET SDK or successful compile required,
# which keeps this lab robust. Switch the csharp leg to build-mode "autobuild" for
# deeper, build-aware results once the Orders API compiles cleanly.
name: security-codeql

on:
  push:
    branches: ["main", "nikomix-module-b-training-lab"]
  pull_request:
    branches: ["main", "nikomix-module-b-training-lab"]
  schedule:
    # Weekly defence-in-depth scan — Mondays 03:27 UTC (off the top of the hour).
    - cron: "27 3 * * 1"
  workflow_dispatch:

# Least privilege at the top level; the analyze job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: security-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      security-events: write # upload SARIF to code scanning
      actions: read # read workflow run metadata (private repos)
      packages: read # restore packages during database creation if needed
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
