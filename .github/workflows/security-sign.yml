# Supply-chain signing — build, sign & attest a container image (Challenge 03).
#
# Reusable workflow (workflow_call) that other workstreams call to produce a *verifiable*
# image: built with Buildx, signed with cosign keyless (Sigstore + GitHub OIDC — no keys
# to manage), accompanied by an SPDX SBOM (attested to the image) and a SLSA build
# provenance attestation. Verification steps live in security/artifact-signing.md.
#
# Standalone demo: run via "Run workflow" (workflow_dispatch); it defaults to the Orders
# API context delivered by Workstream C.
name: security-sign

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name without registry/owner, e.g. orders-api"
        type: string
        required: false
        default: "orders-api"
      context:
        description: "Docker build context"
        type: string
        required: false
        default: "src/legacy-orders-api"
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        required: false
        default: "src/legacy-orders-api/Dockerfile"
      registry:
        description: "OCI registry to push to"
        type: string
        required: false
        default: "ghcr.io"
      push:
        description: "Push, sign and attest (false = build-only, e.g. fork PRs)"
        type: boolean
        required: false
        default: true
    outputs:
      image-ref:
        description: "Signed image reference (name@sha256:digest)"
        value: ${{ jobs.build-sign.outputs.image-ref }}
      digest:
        description: "Image digest (sha256:...)"
        value: ${{ jobs.build-sign.outputs.digest }}
  workflow_dispatch:
    inputs:
      image-name:
        description: "Image name without registry/owner"
        type: string
        default: "orders-api"
      context:
        description: "Docker build context"
        type: string
        default: "src/legacy-orders-api"
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "src/legacy-orders-api/Dockerfile"
      registry:
        description: "OCI registry to push to"
        type: string
        default: "ghcr.io"
      push:
        description: "Push, sign and attest"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-sign-${{ github.ref }}-${{ inputs.image-name }}
  cancel-in-progress: false

jobs:
  build-sign:
    name: Build, sign & attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push image + attestations to GHCR
      id-token: write # keyless cosign signing + provenance (Sigstore OIDC)
      attestations: write # actions/attest-build-provenance
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to the container registry
        if: ${{ inputs.push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        env:
          REGISTRY: ${{ inputs.registry }}
          REPO: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
        shell: bash
        run: |
          base="${REGISTRY}/${REPO}/${IMAGE_NAME}"
          echo "image=${base,,}" >> "$GITHUB_OUTPUT"

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep a single-platform manifest with a simple digest; we attach provenance &
          # SBOM explicitly below rather than via BuildKit's inline attestations.
          provenance: false
          sbom: false

      - name: Compose immutable image reference
        id: ref
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: echo "image-ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.1"

      - name: Sign the image (keyless / Sigstore OIDC)
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image-ref }}
          COSIGN_YES: "true"
        shell: bash
        run: cosign sign "${IMAGE_REF}"

      - name: Generate SBOM (SPDX JSON)
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ref.outputs.image-ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ inputs.image-name }}.spdx.json
          upload-artifact: true
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the SBOM to the image (cosign attestation)
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image-ref }}
          COSIGN_YES: "true"
        shell: bash
        run: cosign attest --type spdxjson --predicate sbom.spdx.json "${IMAGE_REF}"

      - name: Generate SLSA build provenance attestation
        if: ${{ inputs.push }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.img.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
