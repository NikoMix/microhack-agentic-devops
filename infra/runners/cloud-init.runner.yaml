#cloud-config
# ─────────────────────────────────────────────────────────────────────────────
# Contoso Commerce — Agentic DevOps MicroHack · Challenge 02
# Self-hosted GitHub Actions runner bootstrap (Ubuntu 22.04, VMSS).
#
# SECRETLESS BY DESIGN: this cloud-init contains NO credentials. At boot the VM
# uses its user-assigned managed identity to fetch a short-lived runner
# *registration token* from Key Vault over the Key Vault REST API (token from
# IMDS), then registers an ephemeral runner. The placeholders below
# (__UPPER_CASE__) are substituted by infra/modules/runners-vmss.bicep — none of
# them are secrets.
# ─────────────────────────────────────────────────────────────────────────────
package_update: true
packages:
  - jq
  - curl

write_files:
  - path: /opt/ccmh/register-runner.sh
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # ---- substituted by Bicep (non-secret) ----------------------------------
      GITHUB_URL="__GITHUB_URL__"
      RUNNER_VERSION="__RUNNER_VERSION__"
      RUNNER_SHA256="__RUNNER_SHA256__"
      RUNNER_LABELS="__RUNNER_LABELS__"
      RUNNER_GROUP="__RUNNER_GROUP__"
      RUNNER_EPHEMERAL="__RUNNER_EPHEMERAL__"
      KV_NAME="__KV_NAME__"
      SECRET_NAME="__SECRET_NAME__"
      UAMI_CLIENT_ID="__UAMI_CLIENT_ID__"
      RUNNER_USER="runner"
      RUNNER_HOME="/opt/actions-runner"

      log() { printf '[ccmh-runner] %s %s\n' "$(date -u +%FT%TZ)" "$*"; }

      # ---- 1. dedicated, non-root runner user ---------------------------------
      if ! id "${RUNNER_USER}" >/dev/null 2>&1; then
        useradd -m -s /bin/bash "${RUNNER_USER}"
        log "Created runner user '${RUNNER_USER}'."
      fi

      # ---- 2. fetch the JIT registration token from Key Vault via managed id ---
      log "Requesting an Entra token for Key Vault via IMDS (managed identity)…"
      ACCESS_TOKEN="$(curl -fsSL --retry 6 --retry-delay 5 --retry-connrefused \
        -H 'Metadata: true' \
        "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net&client_id=${UAMI_CLIENT_ID}" \
        | jq -r '.access_token')"
      [ -n "${ACCESS_TOKEN}" ] && [ "${ACCESS_TOKEN}" != "null" ] || { log "FATAL: could not obtain managed-identity token"; exit 1; }

      log "Reading registration token secret '${SECRET_NAME}' from '${KV_NAME}'…"
      REG_TOKEN="$(curl -fsSL --retry 6 --retry-delay 5 \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        "https://${KV_NAME}.vault.azure.net/secrets/${SECRET_NAME}?api-version=7.4" \
        | jq -r '.value')"
      [ -n "${REG_TOKEN}" ] && [ "${REG_TOKEN}" != "null" ] || { log "FATAL: registration token secret is empty/missing"; exit 1; }

      # ---- 3. download + checksum-verify the runner ---------------------------
      mkdir -p "${RUNNER_HOME}"
      cd "${RUNNER_HOME}"
      TARBALL="actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
      log "Downloading ${TARBALL}…"
      curl -fsSL --retry 6 --retry-delay 5 -o "${TARBALL}" \
        "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/${TARBALL}"
      echo "${RUNNER_SHA256}  ${TARBALL}" | sha256sum -c - || { log "FATAL: runner checksum mismatch"; exit 1; }
      tar xzf "${TARBALL}"
      rm -f "${TARBALL}"
      chown -R "${RUNNER_USER}:${RUNNER_USER}" "${RUNNER_HOME}"
      ./bin/installdependencies.sh

      # ---- 4. configure the runner (as the non-root user) ---------------------
      RUNNER_NAME="ccmh-$(hostname)"
      EPHEMERAL_FLAG=""
      [ "${RUNNER_EPHEMERAL}" = "true" ] && EPHEMERAL_FLAG="--ephemeral"

      log "Configuring runner '${RUNNER_NAME}' against ${GITHUB_URL} (group=${RUNNER_GROUP}, labels=${RUNNER_LABELS})…"
      sudo -u "${RUNNER_USER}" env RUNNER_ALLOW_RUNASROOT=0 ./config.sh \
        --url "${GITHUB_URL}" \
        --token "${REG_TOKEN}" \
        --name "${RUNNER_NAME}" \
        --labels "${RUNNER_LABELS}" \
        --runnergroup "${RUNNER_GROUP}" \
        --unattended --replace ${EPHEMERAL_FLAG}

      # registration token is no longer needed in memory
      unset REG_TOKEN ACCESS_TOKEN

      # ---- 5. install + start the systemd service -----------------------------
      log "Installing runner service…"
      ./svc.sh install "${RUNNER_USER}"
      ./svc.sh start
      log "Runner online."

runcmd:
  - ["/bin/bash", "-c", "/opt/ccmh/register-runner.sh 2>&1 | tee -a /var/log/ccmh-runner-bootstrap.log"]
